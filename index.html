<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="style.css" />
        <title>Тест</title>
    </head>
    <body>
        <main class="container">
            <form>
                <fieldset>
                  <legend class="legend">Question</legend>
                  <div class="answers"></div>
                  <div class="buttons">
                    <button type="submit">Submit</button>
                    <button>prev</button>
                    <button>next</button>
                  </div>
                </fieldset>
            </form>
            <aside class="sidebar">
                <div class="progress-container">
                    <h2 class="progress">0%</h2>
                    <button class="calc">Calculate</button>
                </div>
                <div class="questions"></div>
            </aside>
        </main>
    </body>
    <script src="script.js" type="module"></script>
</html>
